<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Yehudis Jacobs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#c9a84c;--ink:#1a1714;--muted:#8c857d;--border:#e8e4de}
  body{
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.25rem;padding:2rem 1.5rem;text-align:center;
    background:#fff;color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  .ey{font-size:.6rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:'EB Garamond',Georgia,serif;font-size:clamp(2rem,7vw,3.2rem);font-weight:400;font-style:italic;line-height:1.15}
  p{font-size:.9rem;line-height:1.8;color:var(--muted);max-width:34ch}
  a{
    margin-top:.75rem;display:inline-block;min-height:44px;
    padding:.85rem 2rem;background:var(--ink);color:#fff;text-decoration:none;
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;border-radius:2px;
    transition:background .25s;
  }
  a:hover{background:var(--gold)}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
  <span class="ey">Error 404</span>
  <h1>This page isn't here</h1>
  <p>The link may be out of date, or the page may have moved. The gallery is still where you left it.</p>
  <a href="/">Back to the gallery</a>
</body>
</html>
